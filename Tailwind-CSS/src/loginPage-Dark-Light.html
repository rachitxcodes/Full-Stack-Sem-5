<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./output.css">
    <title>Login</title>
</head>
<body class="grid min-h-screen place-items-center bg-slate-100 p-6 font-sans text-dark dark:bg-black dark:text-white">
    <main class="w-full max-w-sm rounded-xl bg-white p-6 shadow-lg sm:p-8">
        <h1 class="text-center text-3xl font-bold text-primary">Welcome</h1>
        <p class="mt-2 text-center text-slate-500">Log in to your account</p>

        <form class="mt-6 space-y-4">
            <div>
                <label for="email" class="mb-1 block text-sm font-medium">Email</label>
                <input id="email" type="email" placeholder="you@example.com" class="w-full rounded border border-slate-300 px-3 py-2 focus:border-primary focus:outline-none focus:ring-2 focus:ring-blue-200">
            </div>
            <div>
                <label for="password" class="mb-1 block text-sm font-medium">Password</label>
                <input id="password" type="password" placeholder="Enter your password" class="w-full rounded border border-slate-300 px-3 py-2 focus:border-primary focus:outline-none focus:ring-2 focus:ring-blue-200">
            </div>
            <button type="button" class="w-full rounded bg-primary py-2 font-semibold text-white hover:bg-blue-700">
                Log in
            </button>
        </form>
    </main>
</body>
</html>
