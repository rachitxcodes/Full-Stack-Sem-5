<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reaction Timer</title>
    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
            background: bisque;
        }

        #game {
            width: 300px;
            margin: 30px auto;
            padding: 30px;
            border: 2px solid #444;
            border-radius: 10px;
            background: white;
        }

        button {
            padding: 15px 25px;
            font-size: 18px;
            cursor: pointer;
        }

        #clickButton {
            display: none;
            background: tomato;
            color: white;
            border: 0;
        }

        #clickButton.ready {
            background: limegreen;
        }
    </style>
</head>

<body>
    <h1>Reaction Timer</h1>
    <p>Click the green button as quickly as possible.</p>

    <div id="game">
        <button id="startButton">Start</button>
        <button id="clickButton">Click!</button>
        <p id="reactionTime">Reaction Time: -</p>
    </div>

    <script>
        const startButton = document.querySelector("#startButton");
        const clickButton = document.querySelector("#clickButton");
        const reactionTime = document.querySelector("#reactionTime");

        let startTime;
        let timer;

        startButton.addEventListener("click", () => {
            startButton.style.display = "none";
            clickButton.style.display = "inline-block";
            clickButton.classList.remove("ready");
            clickButton.textContent = "Wait...";
            reactionTime.textContent = "Reaction Time: -";

            const delay = Math.floor(Math.random() * 3000) + 1000;

            timer = setTimeout(() => {
                clickButton.classList.add("ready");
                clickButton.textContent = "Click!";
                startTime = Date.now();
            }, delay);
        });

        clickButton.addEventListener("click", () => {
            if (!startTime) {
                clearTimeout(timer);
                reactionTime.textContent = "Too soon! Click Start and try again.";
            } else {
                const time = Date.now() - startTime;
                reactionTime.textContent = `Reaction Time: ${time}ms`;
            }

            startTime = null;
            clickButton.style.display = "none";
            startButton.style.display = "inline-block";
        });
    </script>
</body>

</html>
