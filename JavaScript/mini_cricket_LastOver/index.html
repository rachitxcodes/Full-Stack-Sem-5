<!DOCTYPE html>
<html>
<head>
    <style>
        body { text-align: center; font-family: sans-serif; background: #eee; }
        #pitch { width: 200px; height: 300px; background: green; margin: 20px auto; position: relative; border: 2px solid #333; }
        #crease { position: absolute; bottom: 40px; width: 100%; height: 2px; background: white; }
        #ball { width: 14px; height: 14px; background: red; border-radius: 50%; position: absolute; left: 93px; top: 0; display: none; }
        button { padding: 15px 30px; font-size: 18px; cursor: pointer; }
    </style>
</head>
<body>
    <h2>Runs: <span id="r">0</span>/12 | Balls: <span id="b">6</span> | Wkts: <span id="w">0</span>/1</h2>
    <div id="pitch">
        <div id="crease"></div>
        <div id="ball"></div>
    </div>
    <h3 id="msg">Get Ready!</h3>
    <button id="hit">HIT</button>
    <script src="script.js"></script>
</body>
</html>
