    <h1> Count Down </h1>
    <input type="number" id="min" placeholder="Minutes">
    <button onclick="startTimer()">Start</button>
    <h2 id="timer">00:00</h2>
    <button onclick="addminutes()"> +1 min </button>
    <script>
        let totalSec = 0;
        let interval;

        function startTimer() {
            totalSec = Number(document.getElementById("min").value) * 60;
            clearInterval(interval);
            UpdateTimer();
            interval = setInterval(() => {
                if (totalSec <= 0) {
                    clearInterval(interval);
                    return;
                }
                totalSec--;
                UpdateTimer();
            }, 1000);
        }

        function UpdateTimer() {
            let sec = totalSec % 60;
            let min = Math.floor(totalSec / 60);
                document.getElementById("timer").innerHTML =
        `${String(min).padStart(2, "0")}:${String(sec).padStart(2, "0")}`;    
        }
        UpdateTimer();

        function addminutes() {
            totalSec += 60;
            UpdateTimer();
        }
    </script>
</body>
